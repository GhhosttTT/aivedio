name: contract-tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic==2.5.0" \
            "pydantic-settings==2.1.0" \
            "SQLAlchemy==2.0.23" \
            "celery==5.3.4" \
            "httpx==0.25.2" \
            "Pillow==10.1.0" \
            "PyYAML==6.0.1" \
            "python-dotenv==1.0.0" \
            "loguru==0.7.2" \
            "psycopg2-binary==2.9.9" \
            "pytest==7.4.3" \
            "pytest-asyncio==0.21.1"
      - name: Run contract tests
        run: |
          pytest -q \
            tests/test_config_reference.py \
            tests/test_env_example_contract.py \
            tests/test_packaging_metadata.py \
            tests/test_celery_queue_contract.py \
            tests/test_startup_database.py \
            tests/test_database_engine.py
