name: contract-tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-contract-tests.txt
      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-contract-tests.txt
      - name: Lint launch scripts
        run: |
          flake8 --select=F401,F811,F821,F841,F541 \
            start_services.py start_services_with_logs.py start_all_services.py \
            scripts/ src/
      - name: Run contract tests
        run: |
          pytest -q \
            tests/test_config_reference.py \
            tests/test_env_example_contract.py \
            tests/test_packaging_metadata.py \
            tests/test_import_dependencies.py \
            tests/test_celery_queue_contract.py \
            tests/test_startup_database.py \
            tests/test_startup_ports.py \
            tests/test_startup_service.py \
            tests/test_database_engine.py \
            tests/test_utils/test_file_hash_cache.py \
            tests/test_services/test_video_metrics_cache.py \
            tests/test_services/test_production_readiness_cache.py \
            tests/test_services/test_workflow_manager.py \
            tests/test_services/test_best_practice_library.py

  media-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-media-tests.txt
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-media-tests.txt
      - name: Run media metric tests
        run: pytest -q tests/test_services/test_video_quality_metrics.py tests/test_services/test_video_composer_ffmpeg.py tests/test_services/test_subtitle_generator_ffmpeg.py tests/test_services/test_platform_export_ffmpeg.py tests/test_services/test_cover_generator_ffmpeg.py tests/test_services/test_delivery_package_ffmpeg.py tests/test_services/test_subtitle_rendering_ffmpeg.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check frontend
        run: npx tsc --noEmit --pretty false
